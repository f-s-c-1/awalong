# host 网络单机配置；密钥由环境变量 LIVEKIT_KEYS 注入
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 12
audio:
  active_level: 30
  min_percentile: 40
  update_interval: 400
