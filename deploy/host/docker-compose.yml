# 单机、无域名场景：全部 host 网络，Caddy 只监听 443（80 被其他项目占用，用 TLS-ALPN 签证书）
# 目录约定：/opt/awalong/{web,server,caddy/Caddyfile,livekit.yaml,.env}
# 注意：单文件 bind mount（如 livekit.yaml）被 scp/tar 覆盖后 inode 变化，容器仍看到旧文件，改完必须 --force-recreate；
# Caddyfile 因此改为挂载整个 caddy 目录，覆盖后 caddy reload 即可生效
services:
  caddy:
    image: caddy:2-alpine
    container_name: awalong-caddy
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

  server:
    image: node:20-alpine
    container_name: awalong-server
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["node", "main.js"]
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "3210"
      NODE_ENV: production
      # 用户与战绩（JSON Lines）落在宿主机 /opt/awalong/data，重启不丢
      DATA_DIR: /data
    volumes:
      - ./server:/app:ro
      - ./data:/data
    mem_limit: 200m

  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: awalong-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    env_file: .env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    mem_limit: 250m

volumes:
  caddy-data:
  caddy-config:
