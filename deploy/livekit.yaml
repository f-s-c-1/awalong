# LiveKit 单机配置（密钥通过环境变量 LIVEKIT_KEYS 注入）
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
# 公司 WiFi / 校园网常封 UDP，开启内置 TURN 走 TLS 兜底
turn:
  enabled: true
  domain: ${DOMAIN}
  tls_port: 5349
  udp_port: 3478
  external_tls: true
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 12
audio:
  active_level: 30
  min_percentile: 40
  update_interval: 400
